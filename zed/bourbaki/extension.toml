id = "bourbaki"
name = "Bourbaki"
version = "0.1.0"
schema_version = 1
authors = ["Rushan Davlitshin (mathink-way)"]
description = "Конспекты .bk (bourbaki-engine): подсветка, ошибки проверки, подсказки"

# Откуда Zed берёт грамматику подсветки (см. zed/README.md): GitHub-репозиторий проекта,
# rev это коммит, в котором лежит zed/tree-sitter-bourbaki. После изменения grammar.js
# нужен новый коммит на GitHub и новый rev здесь. Без интернета: sh zed/setup.sh.
[grammars.bourbaki]
repository = "https://github.com/mathink-way/bourbaki-engine"
rev = "c3524b26811f639a8672ecfd3178a85ac1531a76"
path = "zed/tree-sitter-bourbaki"

[language_servers.bourbaki-lsp]
name = "bourbaki-lsp"
languages = ["Bourbaki"]
